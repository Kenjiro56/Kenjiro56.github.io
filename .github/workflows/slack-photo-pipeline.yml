name: Process Slack Photo

on:
  repository_dispatch:
    types: [slack-photo-uploaded]

permissions:
  contents: write

jobs:
  process-photo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }} # コミット後にPagesデプロイを自動トリガーさせるためにPATを使用

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm install sharp exifr

      - name: Process Image and Metadata
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_FILE_URL: ${{ github.event.client_payload.file_url }}
          SLACK_FILE_ID: ${{ github.event.client_payload.file_id }}
          SLACK_TEXT: ${{ github.event.client_payload.text }}
          SLACK_TIMESTAMP: ${{ github.event.client_payload.timestamp }}
        run: |
          node .github/scripts/process-slack-photo.js

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/photos/ src/data/photos-metadata.json
          
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-add photo uploaded from Slack (File ID: ${{ github.event.client_payload.file_id }})"
            git push origin main
          else
            echo "No changes to commit."
          fi
